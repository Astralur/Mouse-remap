<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mouse Remap</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <h1>Mouse Remap</h1>
  <p>Elige un botón y pulsa la tecla o combinación que quieras asignar.</p>
  <label><input type="checkbox" id="enabled"> Activar remapeo</label>
  <label><input type="checkbox" id="block"> Bloquear el clic original</label>
  <div id="mappings"></div>
  <button id="reset">Restablecer asignaciones</button>
  <p id="status" role="status" aria-live="polite"></p>
  <p class="note">Funciona en páginas web que aceptan eventos de teclado sintéticos. No escribe texto automáticamente ni activa atajos de Chrome o del sistema. No funciona en chrome://, Chrome Web Store ni fuera del navegador.</p>
  <script src="mapping.js"></script><script src="popup.js"></script>
</body>
</html>
